<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Cart - Sign Up</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">

  <!-- Bootstrap (Optional) -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/general.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/user_login.css') }}">

  <style>
    .main-container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 60px);
      padding: 20px;
    }

    .login-wrapper {
      background-color: #fff;
      width: 350px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
    }

    .login-wrapper h2 {
      margin-bottom: 20px;
      text-align: center;
      font-weight: 600;
      color: #2d5996;
    }

    .login-wrapper .form-group label {
      font-weight: 500;
      color: #333;
    }

    .login-wrapper .form-control {
      border-radius: 8px;
    }

    .btn-primary {
      background-color: #366CD9;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .btn-primary:hover {
      background-color: #2b54aa;
    }

    .btn-secondary {
      background-color: #6c757d;
      border: none;
      border-radius: 8px;
      font-weight: 500;
    }

    .error-message {
      color: red;
      text-align: center;
      margin-bottom: 15px;
    }
  </style>

</head>
<body>
  <div class="top_menu">
    <div class="logo-container">
      <img src="{{ url_for('static', filename='default-monochrome-white.svg') }}" alt="SmartCart Logo" class="top-logo" />
    </div>
    <div class="title">User Sign Up</div>
    <div class="user_info">
      <a href="/" class="main-return">
        <img src="{{ url_for('static', filename='main-return.png') }}" alt="Return to main page" />
      </a>
    </div>
  </div>

  <!-- Main Container -->
  <div class="main-container">
    <div class="login-wrapper">
      <h2>Sign Up</h2>
      {% if error %}
        <div class="error-message">{{ error }}</div>
      {% endif %}
      <!-- POST form to /signup -->
      <form method="POST" action="/signup">
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="Enter email" />
        </div>
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required />
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm Password:</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm password" required />
        </div>
        <button type="submit" class="btn btn-primary">Sign Up</button>
      </form>
    </div>
  </div>
</body>
</html>
