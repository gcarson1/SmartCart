<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Cart AI</title>

  <!-- Bootstrap (Optional) -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

  <style>
    /* Basic Reset & Box Sizing */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Roboto", sans-serif;
    }
    body {
      background-color: #f9fdff;
    }
    /* Top Bar (blue) */
    .top_menu {
      width: 100%;
      height: 60px;
      background-color: #2d5996;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0px 2px 9px rgba(0, 0, 0, 0.349);
      position: relative;
      z-index: 100;
    }
    .top_menu .title {
      font-size: 18px;
      font-weight: 600;
    }
    .top_menu .user_info {
      display: flex;
      align-items: center;
    }
    .top_menu .user_info .name {
      margin-right: 10px;
      font-weight: 500;
    }
    .top_menu .avatar {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #fff;
    }
    /* Admin avatar image styling */
    .top_menu .admin-avatar img {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 25px;
    }
    /* Dropdown panel styling */
    .avatar-dropdown {
      position: absolute;
      top: 60px;
      right: 20px;
      background: #fff;
      border: 1px solid #ccc;
      box-shadow: 0px 2px 5px rgba(0,0,0,0.3);
      padding: 10px;
      display: none;
      z-index: 1000;
    }
    .avatar-dropdown.show {
      display: block;
    }
    .dropdown-btn {
      background: none;
      border: none;
      color: #2d5996;
      font-size: 14px;
      cursor: pointer;
      padding: 5px 10px;
    }
    /* Main 3-column layout */
    .main-container {
      display: flex;
      height: calc(100vh - 60px);
    }
    /* Left Column: Chat Sessions */
    .left-column {
      width: 25%;
      background-color: #f9fdff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
    }
    .left-column .header {
      padding: 15px;
      background-color: #e9eef3;
      border-bottom: 1px solid #e0e0e0;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .new-chat-btn {
      margin-left: 15px;
      padding: 4px 8px;
      font-size: 14px;
      border: none;
      outline: none;
    }
    .chat-list {
      flex: 1;
      overflow-y: auto;
    }
    .chat-list-item {
      display: flex;
      align-items: center;
      padding: 15px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
    }
    .chat-list-item:hover {
      background-color: #e9eef3ab;
    }
    .chat-list-item .chat-info {
      display: flex;
      flex-direction: column;
    }
    .chat-list-item .chat-info .chat-name {
      font-weight: 500;
    }
    .chat-list-item .chat-info .chat-snippet {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }
    /* Middle Column: Chat Window */
    .middle-column {
      flex: 1;
      background-color: #fff;
      display: flex;
      flex-direction: column;
    }
    .chat_window_header {
      padding: 17px 20px;
      background-color: #e9eef3;
      border-bottom: 1px solid #e0e0e0;
      font-size: 16px;
      font-weight: 500;
      z-index: 1;
      height: 61px;
      position: relative;
    }
    .chat_window_header button {
      padding: 10px 0px;
      position: absolute;
      right: 20px;
      top: 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
    }
    .messages {
      list-style: none;
      flex: 1;
      margin: 0;
      padding: 20px 10px 0 10px;
      overflow-y: auto;
      background-color: #e9eef363;
    }
    .message {
      clear: both;
      overflow: hidden;
      margin-bottom: 20px;
      transition: all 0.5s linear;
      opacity: 0;
      padding: 1vh;
    }
    .message.appeared {
      opacity: 1;
    }
    .text_wrapper {
      display: inline-block;
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 70%;
      line-height: 1.4;
      position: relative;
      font-size: 14px;
    }
    .message.left .text_wrapper {
      background-color: #2d5996;
      color: #fff;
      margin-left: 10px;
      float: left;
      box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.305);
    }
    .message.right .text_wrapper {
      background-color: #009688;
      color: #fff;
      margin-right: 10px;
      float: right;
      box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.299);
    }
    .message.left .avatar {
      float: left;
      margin-right: 10px;
    }
    .message.right .avatar {
      float: right;
      margin-left: 10px;
    }
    /* Bottom input area */
    .bottom_wrapper {
      position: relative;
      border-top: 1px solid #e0e0e0;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      background-color: #fff;
      z-index: 100;
    }
    .message_input_wrapper {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 4px;
      position: relative;
      margin-right: 10px;
      z-index: 101;
    }
    .message_input {
      width: 100%;
      height: 100%;
      border: none;
      padding: 8px 12px;
      font-size: 14px;
      outline: none;
      color: #333;
      z-index: 101;
    }
    .send_message {
      height: 90%;
      background-color: #3a3a3a;
      color: #f8f8f8;
      border: 1px solid #000;
      border-radius: 4px;
      margin-bottom: 2px;
      padding: 4px 16px;
      cursor: pointer;
      transition: all 0.2s linear;
      font-size: 14px;
      z-index: 101;
    }
    .send_message:hover {
      color: #2a2a2a;
      background-color: #fff;
    }
    /* Right Column: Stores & Grocery Lists */
    .right-column {
      width: 25%;
      background-color: #f9fdff;
      border-left: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
    }
    .right-column .header {
      padding: 17px 20px;
      background-color: #e9eef3;
      border-bottom: 1px solid #e0e0e0;
      font-weight: 500;
      height: 61px;
    }
    .stores-lists {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .store-item {
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #e9eef3;
    }
    .store-item h5 {
      margin-bottom: 5px;
      font-size: 15px;
      font-weight: 500;
    }
    .store-item p {
      font-size: 13px;
      color: #555;
    }
    /* Hidden message template for cloning */
    .message_template {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <div class="top_menu">
    <div class="title">Smart Cart</div>
    <div class="user_info">
      <!-- Admin Panel Avatar -->
      <a href="/admin_login" class="admin-avatar">
        <img src="static/admin-image.png" alt="Admin Panel" />
      </a>
      <!-- Clickable Avatar for dropdown -->
      <div class="avatar" id="user-avatar" style="cursor: pointer;"></div>
      <!-- Dropdown panel -->
      <div id="avatar-dropdown" class="avatar-dropdown">
        {% if current_user.is_authenticated %}
          <button onclick="window.location.href='/logout'" class="dropdown-btn">Sign Out</button>
        {% else %}
          <button onclick="window.location.href='/user_login'" class="dropdown-btn">Sign In</button>
        {% endif %}
      </div>
    </div>
  </div>
  
  <!-- Main 3-column container -->
  <div class="main-container">
    <!-- LEFT COLUMN: Chat Sessions -->
    <div class="left-column">
      <div class="header">
        Previous Chats
        <button id="new_chat_btn" class="new-chat-btn"><i class="fas fa-plus"></i></button>
      </div>
      <div class="chat-list">
        <!-- Chat sessions loaded dynamically -->
      </div>
    </div>
    <!-- MIDDLE COLUMN: Chat Window -->
    <div class="middle-column">
      <div class="chat_window_header">
        Chat Window
        <!-- Trashcan icon button -->
        <button id="delete_chat_btn" title="Delete Conversation">
          <i class="fas fa-trash"></i>
        </button>
      </div>
      <ul class="messages"></ul>
      <div class="bottom_wrapper clearfix">
        <div class="message_input_wrapper">
          <input class="message_input" placeholder="Type your message here..."/>
        </div>
        <div class="send_message">
          <i class="fas fa-paper-plane"></i>
        </div>
        
      </div>
      <div class="message_template">
        <li class="message">
          <div class="avatar"></div>
          <div class="text_wrapper">
            <div class="text"></div>
          </div>
        </li>
      </div>
    </div>
    <!-- RIGHT COLUMN: Stores & Grocery Lists -->
    <div class="right-column">
      <div class="header">Stores & Grocery Lists</div>
      <div class="stores-lists">
        <div class="store-item">
          <h5>Store 1</h5>
          <p>Location: 123 Market St.</p>
        </div>
        <hr />
        <div class="store-item">
          <h5>My Grocery List #1</h5>
          <p>- Milk<br/>- Eggs<br/>- Bread</p>
        </div>
      </div>
    </div>
  </div>
  
  <!-- jQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  
  <!-- Chat, Session, and Dropdown Logic -->
  <script>
    // Global variable for the current session id
    var currentSessionId = null;
    
    // Message constructor for chat messages
    var Message = function(arg) {
      this.text = arg.text;
      this.message_side = arg.message_side;
      this.draw = function() {
        var $message = $($('.message_template').clone().html());
        $message.addClass(this.message_side).find('.text').html(this.text);
        $('.messages').append($message);
        setTimeout(function() {
          $message.addClass('appeared');
        }, 0);
      };
    };
    
    // Load chat sessions for the user
    function loadChatSessions() {
      $.getJSON("/chat_sessions", function(data) {
        var $chatList = $('.chat-list');
        $chatList.empty();
        if (data.length === 0) {
          createNewChat();
        } else {
          data.forEach(function(session) {
            var $sessionItem = $('<div class="chat-list-item" data-session-id="' + session.session_id + '"><div class="avatar"></div><div class="chat-info"><div class="chat-name">' + session.title + '</div><div class="chat-snippet">Last message snippet...</div></div></div>');
            $chatList.append($sessionItem);
          });
          if (!currentSessionId) {
            currentSessionId = data[0].session_id;
            loadChatHistory(currentSessionId);
          }
        }
      });
    }
    
    // Create a new chat session
    function createNewChat() {
      $.ajax({
        url: "/new_chat",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify({ title: "New Chat" }),
        success: function(data) {
          currentSessionId = data.session_id;
          loadChatSessions();
          loadChatHistory(currentSessionId);
        },
        error: function() {
          console.error("Failed to create new chat");
        }
      });
    }
    
    // Load chat history for a specific session
    function loadChatHistory(sessionId) {
      $.getJSON("/chat_history", { session_id: sessionId }, function(data) {
        var $messages = $('.messages');
        $messages.empty();
        if (data.length === 0) {
          var initialMsg = new Message({ text: 'How can I help you today?', message_side: 'left' });
          initialMsg.draw();
        } else {
          data.forEach(function(msg) {
            var side = (msg.sender === 'user') ? 'right' : 'left';
            var message = new Message({ text: msg.message, message_side: side });
            message.draw();
          });
        }
        $messages.animate({ scrollTop: $messages.prop('scrollHeight') }, 300);
      });
    }
    
    // Send a message in the current session
    function sendMessage(text) {
      if (text.trim() === '') return;
      $('.message_input').val('');
      var $messages = $('.messages');
      var userMsg = new Message({ text: text, message_side: 'right' });
      userMsg.draw();
      $messages.animate({ scrollTop: $messages.prop('scrollHeight') }, 300);
      $.ajax({
        url: "/get",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify({ msg: text, session_id: currentSessionId }),
        success: function(data) {
          var botMsg = new Message({ text: data.response, message_side: 'left' });
          botMsg.draw();
          $messages.animate({ scrollTop: $messages.prop('scrollHeight') }, 300);
        },
        error: function() {
          console.error("Failed to send message");
        }
      });
    }
    
    $(function() {
      $('#user-avatar').click(function(event) {
        $('#avatar-dropdown').toggleClass('show');
        event.stopPropagation();
      });
      $(document).click(function() {
        $('#avatar-dropdown').removeClass('show');
      });
      
      $('#new_chat_btn').click(function() {
        createNewChat();
      });
      
      loadChatSessions();
      
      $(document).on('click', '.chat-list-item', function() {
        currentSessionId = $(this).data('session-id');
        loadChatHistory(currentSessionId);
      });
      
      $('.send_message').click(function() {
        sendMessage($('.message_input').val());
      });
      
      $('.message_input').keyup(function(e) {
        if (e.which === 13) {
          sendMessage($('.message_input').val());
        }
      });
      
      $('#delete_chat_btn').click(function() {
        if (currentSessionId === null) {
          console.error("No chat session selected.");
          return;
        }
        if (confirm("Are you sure you want to delete this conversation? This action cannot be undone.")) {
          $.ajax({
            url: "/delete_chat_history",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify({ session_id: currentSessionId }),
            success: function(response) {
              console.log(response.message);
              loadChatSessions();
              $('.messages').empty();
              currentSessionId = null;
            },
            error: function() {
              console.error("Failed to delete conversation");
            }
          });
        }
      });
    });
  </script>
</body>
</html>
