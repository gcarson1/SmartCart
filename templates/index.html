<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Cart Mart</title>

  <!-- Bootstrap (Optional) -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <style>
    /* Basic Reset & Box Sizing */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Roboto", sans-serif;
    }

    body {
      background-color: #cecece; /* Light gray behind main container */
    }

    /* Top Bar (blue) */
    .top_menu {
      width: 100%;
      height: 60px;
      background-color: #2d5996; /* Reference-inspired blue */
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 5px 4px 6px rgba(0, 0, 0, 0.991); /* Added shadow under the taskbar */
    }
    .top_menu .title {
      font-size: 18px;
      font-weight: 600;
    }
    .top_menu .user_info {
      display: flex;
      align-items: center;
    }
    .top_menu .user_info .name {
      margin-right: 10px;
      font-weight: 500;
    }
    .top_menu .avatar {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #fff; /* just a placeholder white circle */
    }

    /* Main 3-column layout */
    .main-container {
      display: flex;
      height: calc(100vh - 60px); /* fill rest of viewport under top bar */
    }

    /* Left Column: Saved/Previous Chats */
    .left-column {
      width: 250px;
      background-color: #fff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
    }
    .left-column .header {
      padding: 15px;
      border-bottom: 1px solid #e0e0e0;
      font-weight: 500;
    }
    .chat-list {
      flex: 1;
      overflow-y: auto;
    }
    .chat-list-item {
      display: flex;
      align-items: center;
      padding: 15px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
    }
    .chat-list-item:hover {
      background-color: #f9f9f9;
    }
    .chat-list-item .avatar {
      width: 40px;
      height: 40px;
      background: #bbb; /* placeholder color */
      border-radius: 50%;
      margin-right: 10px;
    }
    .chat-list-item .chat-info {
      display: flex;
      flex-direction: column;
    }
    .chat-list-item .chat-info .chat-name {
      font-weight: 500;
    }
    .chat-list-item .chat-info .chat-snippet {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }

    /* Middle Column: Chat Window */
    .middle-column {
      flex: 1; /* expand to fill space */
      background-color: #fff;
      display: flex;
      flex-direction: column;
    }
    /* Chat Window Header */
    .chat_window_header {
      padding: 10px 20px;
      background-color: #f5f5f5;
      border-bottom: 1px solid #e0e0e0;
      font-size: 16px;
      font-weight: 500;
    }
    /* Keep your chat structure: messages UL + bottom wrapper input */
    .messages {
      list-style: none;
      flex: 1;
      margin: 0;
      padding: 20px 10px 0 10px;
      overflow-y: auto;
      background-color: #fafafa;
    }
    .message {
      clear: both;
      overflow: hidden;
      margin-bottom: 20px;
      transition: all 0.5s linear;
      opacity: 0; /* fade in */
    }
    .message.appeared {
      opacity: 1;
    }
    .message .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: #595959; /* placeholder avatar color */
      display: inline-block;
    }
    .text_wrapper {
      display: inline-block;
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 70%;
      line-height: 1.4;
      position: relative;
      font-size: 14px;
    }
    /* Bot (left) bubble */
    .message.left .text_wrapper {
      background-color: #2d5996;
      color: #fff;
      margin-left: 10px;
      float: left; 
    }
    /* User (right) bubble */
    .message.right .text_wrapper {
      background-color: #009688;
      color: #fff;
      margin-right: 10px;
      float: right;
    }
    .message.left .avatar {
      float: left;
      margin-right: 10px;
    }
    .message.right .avatar {
       float: right;
       margin-left: 10px;
    }

    /* Bottom input area */
    .bottom_wrapper {
      border-top: 1px solid #e0e0e0;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      background-color: #fff;
    }
    .message_input_wrapper {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 4px;
      position: relative;
      margin-right: 10px;
    }
    .message_input {
      width: 100%;
      height: 100%;
      border: none;
      padding: 8px 12px;
      font-size: 14px;
      outline: none;
      color: #333;
    }
    .send_message {
      background-color: #3a3a3a;
      color: #f8f8f8;
      border: 1px solid #000;
      border-radius: 4px;
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.2s linear;
      font-size: 14px;
    }
    .send_message:hover {
      color: #2a2a2a;
      background-color: #fff;
    }

    /* Right Column: Stores & Grocery Lists */
    .right-column {
      width: 300px;
      background-color: #fff;
      border-left: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
    }
    .right-column .header {
      padding: 15px;
      border-bottom: 1px solid #e0e0e0;
      font-weight: 500;
    }
    .stores-lists {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    /* Example styling for store items or lists */
    .store-item {
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #e9eef3;
    }
    .store-item h5 {
      margin-bottom: 5px;
      font-size: 15px;
      font-weight: 500;
    }
    .store-item p {
      font-size: 13px;
      color: #555;
    }

    /* Hidden message template (for JS cloning) */
    .message_template {
      display: none;
    }
  </style>
</head>

<body>

  <!-- Top Bar -->
  <div class="top_menu">
    <div class="title">Smart Cart</div>
    <div class="user_info">
      <div class="avatar"></div>
    </div>
  </div>

  <!-- Main 3-column container -->
  <div class="main-container">

    <!-- LEFT COLUMN: Saved/Previous Chats -->
    <div class="left-column">
      <div class="header">Previous Chats</div>
      <div class="chat-list">
        <!-- Example chat items -->
        <div class="chat-list-item">
          <div class="avatar"></div>
          <div class="chat-info">
            <div class="chat-name">Chat #1</div>
            <div class="chat-snippet">Last message snippet...</div>
          </div>
        </div>
        <!-- Add as many as you want -->
      </div>
    </div>

    <!-- MIDDLE COLUMN: Chat Window -->
    <div class="middle-column">
      <!-- Chat Window Header -->
      <div class="chat_window_header">
        Store 1:
      </div>

      <!-- The <ul> for chat messages -->
      <ul class="messages"></ul>

      <!-- Bottom Input -->
      <div class="bottom_wrapper clearfix">
        <div class="message_input_wrapper">
          <input class="message_input" placeholder="Type your message here..."/>
        </div>
        <div class="send_message">
          <div class="text">Send</div>
        </div>
      </div>

      <!-- Hidden template for new messages -->
      <div class="message_template">
        <li class="message">
          <div class="avatar"></div>
          <div class="text_wrapper">
            <div class="text"></div>
          </div>
        </li>
      </div>
    </div>

    <!-- RIGHT COLUMN: Stores & Grocery Lists -->
    <div class="right-column">
      <div class="header">Stores & Grocery Lists</div>
      <div class="stores-lists">
        <!-- Example store items or lists -->
        <div class="store-item">
          <h5>Store 1</h5>
          <p>Location: 123 Market St.</p>
        </div>
        <hr />
        <div class="store-item">
          <h5>My Grocery List #1</h5>
          <p>- Milk<br/>- Eggs<br/>- Bread</p>
        </div>
        <!-- etc... -->
      </div>
    </div>

  </div>

  <!-- jQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

  <!-- Chat logic (same as your original) -->
  <script>
    (function() {
      var Message = function(arg) {
        this.text = arg.text;
        this.message_side = arg.message_side;
        this.draw = function(_this) {
          return function() {
            var $message = $($('.message_template').clone().html());
            $message.addClass(_this.message_side).find('.text').html(_this.text);
            $('.messages').append($message);
            return setTimeout(function() {
              $message.addClass('appeared');
            }, 0);
          };
        }(this);
        return this;
      };

      $(function() {
        var getMessageText, sendMessage;

        getMessageText = function() {
          return $('.message_input').val();
        };

        sendMessage = function(text) {
          if (text.trim() === '') {
            return;
          }
          $('.message_input').val('');
          var $messages = $('.messages');

          // User's message (right side)
          var userMsg = new Message({
            text: text,
            message_side: 'right'
          });
          userMsg.draw();

          // Call your backend to get bot response
          $.get("/get", { msg: text }).done(function(data) {
            var botMsg = new Message({
              text: data,
              message_side: 'left'
            });
            botMsg.draw();
            $messages.animate({ scrollTop: $messages.prop('scrollHeight') }, 300);
          });

          return $messages.animate({ scrollTop: $messages.prop('scrollHeight') }, 300);
        };

        // Send on button click
        $('.send_message').click(function() {
          sendMessage(getMessageText());
        });

        // Send on Enter key
        $('.message_input').keyup(function(e) {
          if (e.which === 13) {
            sendMessage(getMessageText());
          }
        });

        // Initial greeting from the bot
        var initialMsg = new Message({
          text: 'How can I help you today?',
          message_side: 'left'
        });
        initialMsg.draw();
      });
    }.call(this));
  </script>

</body>
</html>
