<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Cart - Sign Up</title>
  
  <!-- Bootstrap (Optional) -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/general.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}">

</head>
<body>
  <!-- Top Bar -->
  <div class="top_menu">
    <div class="user_info">
      <!-- Return to main page button -->
      <a href="/user_login" class="main-return">
        <img src="static/main-return.png" alt="Return to previous page" />
      </a>
      <!-- User Avatar (placeholder) -->
    </div>
  </div>

  <!-- Main Container -->
  <div class="main-container">
    <div class="signup-wrapper">
      <h2>Sign Up</h2>
      {% if error %}
        <div class="error-message">{{ error }}</div>
      {% endif %}
      <!-- POST form to /signup -->
      <form method="POST" action="/signup">
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="Enter email (optional)" />
        </div>
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required />
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm Password:</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm password" required />
        </div>
        <button type="submit" class="btn btn-primary">Sign Up</button>
      </form>
    </div>
  </div>
</body>
</html>
