<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Cart - Admin Sign Up</title>
  
  <!-- Bootstrap (Optional) -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/general.css') }}">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_signup.css') }}">

</head>
<body>
  <div class="top_menu">
    <div class="user_info">
      <a href="/" class="main-return">
        <img src="static/main-return.png" alt="Return to main page" />
      </a>
    </div>
  </div>
  <div class="main-container">
    <div class="login-wrapper">
      <h2>Create Admin Account</h2>
      {% if error %}
        <div class="error-message">{{ error }}</div>
      {% endif %}
      <form method="POST" action="/admin_signup">
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Enter a username" required />
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required />
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm Password:</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm your password" required />
        </div>
        <button type="submit" class="btn btn-primary">Create Admin Account</button>
      </form>
      <div class="text-center" style="margin-top: 15px;">
        <a href="/admin_login" class="btn btn-secondary">Back to Admin Login</a>
      </div>
    </div>
  </div>
</body>
</html>
