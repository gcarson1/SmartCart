<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Cart - User Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">

  <!-- Bootstrap (Optional) -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/general.css') }}">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/user_login.css') }}">

</head>
<body>
  <!-- Top Bar -->
  <div class="top_menu">
    <div style="flex: 1;"></div> <!-- Empty spacer to push to right -->
    <div class="user_info">
      <a href="/" class="main-return">
        <img src="static/main-return.png" alt="Return to main page" />
      </a>
    </div>
  </div>

  <!-- Main Container -->
  <div class="main-container">
    <div class="login-wrapper">
      <h2>User Login</h2>
      {% if error %}
        <div class="error-message">{{ error }}</div>
      {% endif %}
      <!-- POST form to /user_login -->
      <form method="POST" action="/user_login">
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" />
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>

      
      <!-- Sign Up Button -->
      <div class="text-center signup-btn">
        <a href="/signup" class="btn btn-secondary">Sign Up</a>
      </div>
    </div>
  </div>
</body>
</html>
